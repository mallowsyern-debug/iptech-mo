<html lang="en">

<script src="tf.min.js"></script>
<script>try{var t=localStorage.getItem("iptech_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{--bg:#eafaf1;--card:rgba(255,255,255,.72);--tx:#10261a;--mu:#587063;--item:rgba(16,185,129,.10);--bd:rgba(16,120,80,.16);--rd:#e11d48;--warn:rgba(225,29,72,.10);--g:#059669;--g2:#34d399;--sh:0 10px 30px rgba(5,150,105,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06110b;--card:rgba(18,34,25,.68);--tx:#e9fbf1;--mu:#8fb3a0;--item:rgba(52,211,153,.10);--bd:rgba(52,211,153,.18);--rd:#fb7185;--warn:rgba(251,113,133,.12);--g:#34d399;--g2:#6ee7b7;--sh:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06110b;--card:rgba(18,34,25,.68);--tx:#e9fbf1;--mu:#8fb3a0;--item:rgba(52,211,153,.10);--bd:rgba(52,211,153,.18);--rd:#fb7185;--warn:rgba(251,113,133,.12);--g:#34d399;--g2:#6ee7b7;--sh:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;background:radial-gradient(circle at 20% 25%,rgba(52,211,153,.45),transparent 40%),radial-gradient(circle at 80% 15%,rgba(132,204,22,.30),transparent 38%),radial-gradient(circle at 60% 85%,rgba(20,184,166,.38),transparent 42%);filter:blur(30px);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.12)}}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin:10px 12px 0;border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{font-size:22px;font-weight:900;letter-spacing:.3px;cursor:pointer;background:linear-gradient(90deg,#059669,#84cc16);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .ic{stroke:#059669}
.hright{display:flex;gap:8px}
.hbtn{background:var(--item);color:var(--g);border:1px solid var(--bd);border-radius:14px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}
#themeBtn .ic{margin:0}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:24px;box-shadow:var(--sh);margin-bottom:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
h2{margin:0 0 6px;font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--g),#84cc16);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu);font-size:14px;line-height:1.5}
.btn{position:relative;overflow:hidden;display:block;width:100%;padding:15px;margin-top:12px;border:0;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#059669,#10b981 55%,#84cc16);box-shadow:0 8px 22px rgba(16,185,129,.38);transition:transform .15s ease,box-shadow .2s ease}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn.alt{background:var(--item);color:var(--g);border:2px solid var(--g);box-shadow:none}
.btn.alt::after{display:none}
.btn:disabled{background:#8fa59a;box-shadow:none;cursor:not-allowed}
.btn:disabled::after{display:none}
.btn:focus-visible,.hbtn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.row{display:flex;gap:12px}
.row .btn{flex:1;padding:26px 10px;margin-top:18px;border-radius:22px}
.row .btn:first-child{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(16,185,129,.38)}50%{box-shadow:0 8px 34px rgba(16,185,129,.75)}}
.ic{width:1.15em;height:1.15em;vertical-align:-0.2em;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor}
.row .btn [data-ic]{display:block}
.row .btn .ic{display:block;margin:0 auto 8px;width:2.4em;height:2.4em}
.scan{position:relative;overflow:hidden;border-radius:18px;margin-top:12px}
img.pv,video{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:18px;background:#000;margin-top:12px}
.scan img.pv{margin-top:0}
img.pv{background:var(--item)}
.scan.on::after{content:"";position:absolute;left:0;right:0;height:4px;top:0;background:linear-gradient(90deg,transparent,#34d399,#a3e635,transparent);box-shadow:0 0 18px 6px rgba(52,211,153,.8);animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{0%{top:0}50%{top:calc(100% - 4px)}100%{top:0}}
.ring{width:116px;height:116px;border-radius:50%;margin:10px auto 2px;display:grid;place-items:center;background:conic-gradient(var(--g2) calc(var(--p)*1%),var(--bd) 0)}
.ring span{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:24px;font-weight:900;color:var(--g)}
.item{background:var(--item);border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.5}
.item b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--g);margin-bottom:4px}
.warn{background:var(--warn);border-left-color:var(--rd)}
.warn b{color:var(--rd)}
.sci{font-style:italic;color:var(--mu);margin-top:2px}
.note{font-size:12px;color:var(--mu);margin-top:16px;line-height:1.5}
.err{color:var(--rd);font-size:14px;margin-top:12px}
.hist{display:flex;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--bd);border-radius:14px;cursor:pointer}
.hist:hover{background:var(--item)}
.hist img{width:60px;height:60px;object-fit:cover;border-radius:14px}
.hist .t{flex:1}
.iconbtn{background:none;border:0;font-size:20px;cursor:pointer;padding:6px;color:#f59e0b}
.iconbtn.del{color:var(--rd)}
.iconbtn .ic{margin:0;width:1.3em;height:1.3em}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:2px solid var(--g);background:var(--item);color:var(--g);border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.tabs button .ic{margin-right:4px}
.hbtn,.iconbtn,.tabs button,.hist{transition:transform .15s ease,background .2s ease}
@media (hover:hover){
.btn:hover:not(:disabled){transform:translateY(-3px) scale(1.04);box-shadow:0 14px 30px rgba(16,185,129,.55)}
.btn:hover:not(:disabled)::after{left:130%;transition:left .6s ease}
.hbtn:hover{transform:scale(1.08)}
.iconbtn:hover{transform:scale(1.25)}
.tabs button:hover{transform:scale(1.04)}
.hist:hover{transform:scale(1.015)}
}
.btn:active:not(:disabled){transform:scale(.97)}
.hbtn:active{transform:scale(.95)}
section:not(.hide){animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.vf{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;margin-top:12px;background:#000}
.vf video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;margin:0;border-radius:0}
.box{position:absolute;inset:15%;border:2px dashed rgba(255,255,255,.6);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.42);transition:border-color .25s,box-shadow .25s}
.box.ok{border:2px solid #34d399;box-shadow:0 0 0 999px rgba(0,0,0,.42),0 0 22px 4px rgba(52,211,153,.7)}
.box i{position:absolute;width:26px;height:26px;border:4px solid #34d399}
.box i:nth-child(1){top:-4px;left:-4px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.box i:nth-child(2){top:-4px;right:-4px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.box i:nth-child(3){bottom:-4px;left:-4px;border-right:0;border-top:0;border-radius:0 0 0 16px}
.box i:nth-child(4){bottom:-4px;right:-4px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.vf.live .box::after{content:"";position:absolute;left:6px;right:6px;top:4px;height:3px;background:linear-gradient(90deg,transparent,#34d399,transparent);animation:sweep2 1.8s ease-in-out infinite}
@keyframes sweep2{0%{top:4px}50%{top:calc(100% - 7px)}100%{top:4px}}
.vhint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px #000}
.live{margin-top:14px}
.livecard{min-height:200px}
.livecard .live{margin-top:0}
@media (min-width:820px){
main{max-width:1040px}
main>section:not(#camera){max-width:480px;margin-left:auto;margin-right:auto}
#camera .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
}
.grp{margin:16px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.badge{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--warn);color:var(--rd);font-size:11px;font-weight:700;vertical-align:middle}
.badge .ic{margin:0;width:1em;height:1em}
.lvl{text-align:center;font-weight:700;margin-top:6px}
.lvl.high{color:var(--g)}
.lvl.med{color:#d97706}
.hide{display:none}
/* ---- SHARPER ---- */
:root{--bd:rgba(5,120,85,.30);--card:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(14,26,19,.88);--bd:rgba(52,211,153,.34)}}
:root[data-theme="dark"]{--card:rgba(14,26,19,.88);--bd:rgba(52,211,153,.34)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header{border-radius:14px;border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(5,150,105,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.brand{font-weight:900;letter-spacing:.2px}
.card{border-radius:18px;border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(5,150,105,.12),inset 0 1px 0 rgba(255,255,255,.4)}
h2{font-size:24px;font-weight:900;letter-spacing:-.01em}
.btn{border-radius:12px;letter-spacing:.02em;box-shadow:0 6px 16px rgba(16,185,129,.38),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12)}
.row .btn{border-radius:14px}
.hbtn{border-radius:10px;border:1px solid var(--bd)}
.item{border-radius:8px;border-left-width:3px}
.item b{font-size:11px;letter-spacing:.12em}
.hist,.hist img,.tabs button{border-radius:10px}
.hist img{border:1px solid var(--bd)}
.badge{border-radius:6px}
.scan,img.pv,video{border-radius:12px}
.vf{border-radius:14px;border:1px solid var(--bd)}
.box{border-radius:10px}
.box i{width:30px;height:30px;border-width:3px}
.box i:nth-child(1){top:-3px;left:-3px;border-radius:10px 0 0 0}
.box i:nth-child(2){top:-3px;right:-3px;border-radius:0 10px 0 0}
.box i:nth-child(3){bottom:-3px;left:-3px;border-radius:0 0 0 10px}
.box i:nth-child(4){bottom:-3px;right:-3px;border-radius:0 0 10px 0}
.ring span{box-shadow:inset 0 0 0 1px var(--bd)}
.lvl{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
/* ---- SHARPER 2 ---- */
:root{--bd:rgba(5,120,85,.45);--card:rgba(255,255,255,.94);--tx:#06180f;--mu:#4a6256}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(10,20,15,.94);--bd:rgba(52,211,153,.5);--tx:#f0fff7}}
:root[data-theme="dark"]{--card:rgba(10,20,15,.94);--bd:rgba(52,211,153,.5);--tx:#f0fff7}
header{border-radius:10px;border-width:1.5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(5,150,105,.22)}
.brand{text-transform:uppercase;letter-spacing:.08em;font-size:20px}
.card{border-radius:10px;border-width:1.5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(5,150,105,.20),0 12px 24px rgba(5,150,105,.10)}
h2{text-transform:uppercase;letter-spacing:.04em;font-size:22px}
.btn{border-radius:8px;text-transform:uppercase;letter-spacing:.08em;font-size:15px;box-shadow:0 4px 0 #046c4e,0 8px 18px rgba(16,185,129,.35)}
.btn.alt{border-radius:8px;box-shadow:0 4px 0 var(--bd)}
.row .btn{border-radius:10px}
@media (hover:hover){.btn:hover:not(:disabled){box-shadow:0 7px 0 #046c4e,0 14px 26px rgba(16,185,129,.45)}.btn.alt:hover:not(:disabled){box-shadow:0 7px 0 var(--bd)}}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #046c4e}
.hbtn{border-radius:6px}
.item{border-radius:4px;border-left-width:4px}
.item b{letter-spacing:.14em}
.hist,.hist img,.tabs button{border-radius:6px}
.hist img{border:2px solid var(--bd)}
.tabs button{text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.badge{border-radius:3px;text-transform:uppercase;letter-spacing:.06em}
.grp{letter-spacing:.16em}
.scan,img.pv,video{border-radius:6px}
.vf{border-radius:8px;border-width:2px}
.box{border-radius:4px}
.box i{width:34px;height:34px;border-width:4px}
.box i:nth-child(1){top:-4px;left:-4px;border-radius:0}
.box i:nth-child(2){top:-4px;right:-4px;border-radius:0}
.box i:nth-child(3){bottom:-4px;left:-4px;border-radius:0}
.box i:nth-child(4){bottom:-4px;right:-4px;border-radius:0}
.ring span{box-shadow:inset 0 0 0 2px var(--bd)}
.lvl{letter-spacing:.1em}
.vhint{text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.lswitch{position:relative;display:inline-flex;align-items:center;width:84px;height:34px;padding:0;border:1.5px solid var(--bd);border-radius:8px;background:var(--item);color:var(--g);font:800 12px Arial,sans-serif;letter-spacing:.06em;cursor:pointer;transition:transform .15s ease}
.lswitch span{position:relative;z-index:1;flex:1;text-align:center;transition:color .2s}
.lswitch i{position:absolute;top:3px;left:3px;width:38px;height:24px;border-radius:5px;background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 2px 0 #046c4e;transition:transform .2s ease}
.lswitch.tl i{transform:translateX(37px)}
.lswitch:not(.tl) span:first-child,.lswitch.tl span:nth-child(2){color:#fff}
.lswitch:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
@media (hover:hover){.lswitch:hover{transform:scale(1.06)}}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rhead h2{margin:0}

}

</style>
</head>
<body>
<header>
  <div class="brand" onclick="show('home')"><span data-ic="scanleaf"></span>i-PTech MO</div>
  <div class="hright"><button class="lswitch" id="langBtn" onclick="toggleLang()" role="switch" aria-checked="false" aria-label="Language" title="English / Tagalog"><span>EN</span><span>TL</span><i></i></button><button class="hbtn" id="themeBtn" onclick="toggleTheme()" aria-label="Change theme" title="Change theme"></button><button class="hbtn hbtn-h" onclick="openHistory()" aria-label="History"><span data-ic="hist"></span>History</button></div>
</header>
<main>
  <section id="home">
    <div class="hero">
      <div class="heroic"><span data-ic="scanleaf"></span></div>
      <h1>Identify your plant in seconds</h1>
      <p class="mu">Learn its name, whether it is safe, and how often to water it.</p>
    </div>
    <div class="card">
      <h2>Scan a Plant</h2>
      <p class="mu">Take a photo or upload one to identify your plant.</p>
      <div class="row">
        <button class="btn" onclick="openCamera()"><span data-ic="cam"></span>Camera</button>
        <button class="btn alt" onclick="$('up').click()"><span data-ic="up"></span>Upload</button>
      </div>
    </div>
    <div class="card hide" id="recentCard">
      <div class="rhead"><h2>Recent Scans</h2><button class="link" onclick="openHistory()">See all</button></div>
      <div id="recentList"></div>
    </div>
  </section>

  <section id="camera" class="hide">
    <div class="split">
      <div class="card">
        <h2>Live Scan</h2>
        <div class="vf" id="vf">
          <video id="video" autoplay playsinline muted></video>
          <div class="box" id="box"><i></i><i></i><i></i><i></i></div>
          <div class="vhint">Place the plant inside the box</div>
        </div>
        <button class="btn" id="saveBtn" onclick="saveLive()" disabled><span data-ic="star"></span>Save to History</button>
        <button class="btn alt" onclick="show('home')"><span data-ic="back"></span>Back to Home</button>
      </div>
      <div class="card livecard">
        <div class="live" id="live"></div>
      </div>
    </div>
  </section>

  <section id="preview" class="hide">

const UNKNOWN_LIMIT = 0.25;
function interpret(probs) {
  const idx = probs.map((p, i) => i).sort((a, b) => probs[b] - probs[a]);
  const best = CLASSES[idx[0]];
  const isUnknown = pkey(best) === "unknown" || (UNK >= 0 && probs[UNK] >= UNKNOWN_LIMIT);
  return {
    plant: best,
    unknown: isUnknown,
    confidence: Math.round(probs[idx[0]] * 1000) / 10,
    info: isUnknown ? null : (PLANTS[pkey(best)] || null),

function renderRecent() {

function frameCanvas(v) {
  const S = Math.min(v.videoWidth, v.videoHeight), bs = S * 0.7;
  const c = document.createElement("canvas");
  c.width = 224; c.height = 224;
  c.getContext("2d").drawImage(v, (v.videoWidth - bs) / 2, (v.videoHeight - bs) / 2, bs, bs, 0, 0, 224, 224);
  return c;
}
async function fileToCanvas(f) {
  const bmp = await createImageBitmap(f);
  const c = document.createElement("canvas");
  c.width = 224; c.height = 224;
  c.getContext("2d").drawImage(bmp, 0, 0, 224, 224);
  if (bmp.close) bmp.close();
  return c;
}
function frameBlob(v) {
  const S = Math.min(v.videoWidth, v.videoHeight), bs = S * 0.7;
  const c = document.createElement("canvas");
  c.width = 224; c.height = 224;
  c.getContext("2d").drawImage(v, (v.videoWidth - bs) / 2, (v.videoHeight - bs) / 2, bs, bs, 0, 0, 224, 224);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}
function infoItems(i) {

    + '<div class="item"><b>Watering</b>' + esc(F(i, "watering")) + '</div>'
    + '<div class="item"><b>Indoor / Outdoor / Backyard</b>' + (F(i, "placement") || []).map(esc).join("<br>") + '</div>';
}

  if (i) h += '<div class="sci">' + esc(i.scientific_name) + '</div>';
  h += '<div class="ring" style="--p:' + d.confidence + '"><span>' + d.confidence + '%</span></div>' + lvl(d.confidence) + alt(d);
  if (i) h += infoItems(i);
  return h;
}
function startLive() {

}

}
async function tick() {
  if (!live) return;

      const d = await predictCanvas(frameCanvas(v));
      if (live) handleLive(d);
    } catch (e) {
      if (live) $("live").innerHTML = '<p class="err">The model could not run. Please reload the page and try again.</p>';
    }

  }

function handleLive(d) {
  const ok = !d.unknown && d.confidence >= THRESH;

  lastKey = k;
  if (streak < NEED) return;

async function openCamera() {

}
function capture() {
  const v = $("video");

  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);

}

}

$("camfile").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };

function makeThumb(f) {
  return new Promise(res => {
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 240 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL("image/jpeg", 0.7));
    };

    img.src = u;
  });
}

async function identify() {
  const b = $("idbtn");
  b.disabled = true; b.textContent = "Identifying..."; $("err").textContent = ""; $("scanbox").classList.add("on");
  try {
    await READY;
    if (!MODEL) throw new Error("model not ready");
    const d = await predictCanvas(await fileToCanvas(file));
    const thumb = await makeThumb(file);
    const rec = { plant: d.plant, unknown: !!d.unknown, confidence: d.confidence, info: d.info, top3: d.top3, ms: d.ms, thumb: thumb, date: new Date().toISOString() };
    showResult(rec, currentUrl);
    if (d.confidence >= THRESH && !d.unknown) saveHistory(rec);
  } catch (e) {
    $("err").textContent = "The image could not be read, or the model is not ready yet. Please try again.";
  }

    h += '<h2 style="margin-top:14px">' + esc(i ? i.name : nice(r.plant)) + '</h2>';
    if (i) h += '<div class="sci">' + esc(i.scientific_name) + '</div>';
    h += '<div class="item"><b>Confidence level</b><div class="ring" style="--p:' + r.confidence + '"><span>' + r.confidence + '%</span></div>' + lvl(r.confidence) + '</div>' + alt(r);
    if (i) {
      h += '<div class="item"><b>Estimated height</b>' + esc(F(i, "height")) + '</div>';
      h += '<div class="item ' + (i.dangerous ? "warn" : "") + '"><b>' + (i.dangerous ? ICONS.warn + "Potentially dangerous" : ICONS.check + "Generally safe") + '</b>' + esc(F(i, "danger_note")) + '</div>';
      h += '<div class="item"><b>Watering</b>' + esc(F(i, "watering")) + '</div>';
      h += '<div class="item"><b>Indoor / Outdoor / Backyard</b>' + (F(i, "placement") || []).map(esc).join("<br>") + '</div>';
    } else {
      h += '<div class="item"><b>Plant information</b>Not available yet for this plant.</div>';
    }
  }
  if (r.ms) h += '<p class="note">Response time: ' + r.ms + ' ms</p>';
  h += '<p class="note">The confidence level shows how sure the AI is and does not guarantee the answer is correct. Height and watering vary with the environment. In an emergency, contact a doctor or veterinarian.</p>';
  $("resbody").innerHTML = h;
  show("result");
}

function loadH() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function saveHistory(r) {
  try {
    const h = loadH(); h.unshift(r);
    localStorage.setItem(KEY, JSON.stringify(h.slice(0, 30)));
  } catch (e) {}
}
let histFilter = "all";
function setFilter(f) { histFilter = f; openHistory(); }
function writeH(h) { try { localStorage.setItem(KEY, JSON.stringify(h)); } catch (e) {} }
function dayLabel(iso) {
  const d = new Date(iso), n = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const diff = Math.round((b - a) / 86400000);
  return diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : "Earlier";
}
function openHistory() {
  const rows = loadH().map((r, i) => ({ r: r, i: i })).filter(x => histFilter === "all" || x.r.fav);
  $("tabAll").classList.toggle("on", histFilter === "all");
  $("tabFav").classList.toggle("on", histFilter === "fav");
  let h = "", last = "";
  rows.forEach(x => {
    const g = dayLabel(x.r.date);
    if (g !== last) { h += '<div class="grp">' + g + '</div>'; last = g; }
    const xi = infoFor(x.r);
    const badge = xi && xi.dangerous ? '<span class="badge">' + ICONS.warn + 'Caution</span>' : "";
    h += '<div class="hist" onclick="openItem(' + x.i + ')"><img src="' + esc(x.r.thumb) + '" alt=""><div class="t"><b>' + esc(xi ? xi.name : nice(x.r.plant)) + '</b>' + badge + '<div class="mu">' + x.r.confidence + '% · ' + esc(new Date(x.r.date).toLocaleString()) + '</div></div><button class="iconbtn" onclick="toggleFav(' + x.i + ',event)">' + (x.r.fav ? ICONS.starfill : ICONS.star) + '</button><button class="iconbtn del" onclick="delItem(' + x.i + ',event)">' + ICONS.trash + '</button></div>';
  });
  $("hlist").innerHTML = h || '<p class="mu">' + (histFilter === "fav" ? "No favorites yet." : "No scans yet.") + '</p>';
  show("history");
}
function toggleFav(i, ev) {
  ev.stopPropagation();
  const h = loadH();
  if (h[i]) { h[i].fav = !h[i].fav; writeH(h); openHistory(); }
}
function delItem(i, ev) {
  ev.stopPropagation();
  if (!confirm(tr("Delete this plant from history?"))) return;
  const h = loadH();
  h.splice(i, 1); writeH(h); openHistory();
}
function openItem(i) {
  const r = loadH()[i];
  if (r) showResult(r, r.thumb);
}
function clearH() {
  if (confirm(tr("Clear all history?"))) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    openHistory();
  }
}
</script>
